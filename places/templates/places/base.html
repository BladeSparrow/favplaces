{% load static %}
<!doctype html>
<html lang='uk'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1'>
  <title>{% block title %}FavPlaces{% endblock %}</title>
  <link rel='stylesheet' href="{% static 'places/css/main.css' %}">
  <link rel="icon" type="image/x-icon" href="{% static 'places/img/favicon.ico' %}">
</head>
<body>
  <header>
    <nav>
      <a href="{% url 'places:home' %}">Головна</a> |
      <a href="{% url 'places:place_list' %}">Список місць</a> |
      <a href="{% url 'places:place_add' %}">Додати місце</a>

    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>Сайт створено: 2025-09-17. Автор: Максим Кудик</footer>
  <script src="https://unpkg.com/htmx.org@1.9.2"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
